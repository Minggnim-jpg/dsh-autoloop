# Bundle patch layer for dsh-autoloop.
#
# One row serves both halves: the package main entry (`lib/index.js`) is the
# host-side Cordis plugin that registers `/api/autoloop/*` on the dsh connection
# service, and the `dsh.client` declaration in package.json tells the web app to
# also load `lib/client.js` into the browser (sidebar icon + main panel).
- insert:
    - id: dsh-autoloop
      name: dsh-autoloop
