name: Traffic Archive

# GitHub 的 traffic/views、traffic/clones 只保留 14 天，过期不可恢复。
# 这里每天拉一次并合并进 data/traffic/，让历史长期留存。

on:
  schedule:
    # 每天 UTC 01:10（北京时间 09:10）
    - cron: '10 1 * * *'
  workflow_dispatch:
    inputs:
      repos:
        description: '只统计指定仓库，逗号分隔；留空则统计全部公开仓库'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: traffic-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect traffic
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPOS: ${{ inputs.repos }}
        run: node scripts/collect-traffic.mjs

      - name: Commit archive
        run: |
          if [ -z "$(git status --porcelain data/traffic)" ]; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/traffic
          git commit -m "chore(traffic): 更新流量存档 $(date -u +%Y-%m-%d)"
          git push
